<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>RAXO</title>
<style>
  :root{
    --blue:#1e6dff;
    --blue-2:#4a8fff;
    --blue-glow:rgba(30,109,255,.5);
    --bg:#050608;
    --panel:#0c0e14;
    --panel-2:#141822;
    --stroke:rgba(255,255,255,.06);
    --text:#eef1f7;
    --text-dim:#7a8599;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-drag:none}
  html,body{
    width:100%;height:100%;overflow:hidden;background:transparent;
    font-family:"Inter","Segoe UI",system-ui,sans-serif;
    font-size:13px;color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  body{display:none}
  body.open{display:block}

  /* ---------- CHARGEMENT ---------- */
  .loading{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,.94);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:9999;transition:opacity .5s ease;
  }
  .loading.hide{opacity:0;pointer-events:none}
  .loading .logo{
    font-size:72px;font-weight:800;color:#fff;letter-spacing:18px;
    margin-bottom:40px;text-shadow:0 0 40px var(--blue-glow);
  }
  .loading .logo span{color:var(--blue)}
  .loading .bar{
    width:420px;height:3px;background:rgba(255,255,255,.06);
    border-radius:2px;overflow:hidden;position:relative;
  }
  .loading .bar::after{
    content:'';position:absolute;top:0;left:0;height:100%;width:0%;
    background:linear-gradient(90deg,var(--blue),var(--blue-2));
    box-shadow:0 0 14px var(--blue);
    animation:fill 2s ease forwards;
  }
  @keyframes fill{to{width:100%}}
  .loading .pct{font-size:11px;color:var(--text-dim);margin-top:14px;letter-spacing:2px}

  /* ---------- BIND KEY ---------- */
  .bind{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,.94);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    z-index:9998;
  }
  .bind.show{display:flex}
  .bind h1{font-size:56px;font-weight:800;color:#fff;margin-bottom:12px;letter-spacing:10px}
  .bind h1 span{color:var(--blue)}
  .bind h2{font-size:16px;font-weight:400;color:var(--text-dim);margin-bottom:40px;letter-spacing:3px;text-transform:uppercase}
  .bind .box{
    width:420px;height:80px;border:1px solid rgba(30,109,255,.4);border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;color:#fff;font-weight:600;transition:all .3s;
    background:rgba(30,109,255,.04);
  }
  .bind .box.recording{
    border-color:var(--blue);box-shadow:0 0 40px var(--blue-glow);
    animation:pulse 1.2s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
  .bind .hint{font-size:12px;color:var(--text-dim);margin-top:20px;letter-spacing:1px}

  /* ---------- MENU PRINCIPAL ---------- */
  .wrap{
    position:fixed;top:80px;left:80px;
    width:860px;height:560px;
    background:var(--bg);
    border:1px solid var(--stroke);
    border-radius:16px;
    box-shadow:0 40px 100px rgba(0,0,0,.8), 0 0 60px -20px var(--blue-glow);
    overflow:hidden;
    display:grid;
    grid-template-columns:200px 260px 1fr;
    cursor:default;
  }

  /* --- barre gauche : catégories --- */
  .cats{
    background:var(--panel);
    border-right:1px solid var(--stroke);
    display:flex;flex-direction:column;
    padding:14px 0;
    overflow-y:auto;
  }
  .cats::-webkit-scrollbar{width:4px}
  .cats::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}

  .cat{
    padding:14px 18px;
    font-size:14px;font-weight:500;
    color:var(--text-dim);
    cursor:pointer;
    border-left:3px solid transparent;
    transition:all .15s;
    display:flex;align-items:center;justify-content:space-between;
  }
  .cat:hover{color:#fff;background:rgba(30,109,255,.06)}
  .cat.active{
    color:#fff;
    background:linear-gradient(90deg,rgba(30,109,255,.18),transparent);
    border-left-color:var(--blue);
  }
  .cat .arrow{font-size:14px;opacity:.5}
  .cat.active .arrow{opacity:1;color:var(--blue)}

  /* --- colonne milieu : sous-catégories / items --- */
  .mid{
    background:var(--panel-2);
    border-right:1px solid var(--stroke);
    display:flex;flex-direction:column;
    overflow-y:auto;
  }
  .mid::-webkit-scrollbar{width:4px}
  .mid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}

  .mid-h{
    padding:14px 18px;
    font-size:11px;font-weight:700;
    color:var(--blue-2);
    text-transform:uppercase;letter-spacing:2px;
    border-bottom:1px solid var(--stroke);
    flex-shrink:0;
  }

  .item{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 18px;height:44px;
    border-bottom:1px solid rgba(255,255,255,.03);
    cursor:pointer;transition:background .12s;
  }
  .item:hover{background:rgba(30,109,255,.08)}
  .item.active{background:rgba(30,109,255,.14)}
  .item .name{font-size:13.5px;color:var(--text);font-weight:500}
  .item.active .name{color:#fff}
  .item .arrow{font-size:13px;color:var(--text-dim)}

  /* --- colonne droite : contrôles --- */
  .ctl-col{
    padding:20px 24px;
    display:flex;flex-direction:column;gap:16px;
    overflow-y:auto;
  }
  .ctl-col::-webkit-scrollbar{width:4px}
  .ctl-col::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}

  .ctl-title{
    font-size:11px;font-weight:700;color:var(--blue-2);
    text-transform:uppercase;letter-spacing:2px;
    padding-bottom:10px;border-bottom:1px solid var(--stroke);
    margin-bottom:6px;
  }

  .ctl-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 0;
  }
  .ctl-row .label{font-size:12.5px;color:var(--text-dim)}
  .ctl-row.on .label{color:#fff}

  .tg{
    width:38px;height:20px;border-radius:12px;position:relative;
    background:rgba(255,255,255,.08);transition:background .2s;cursor:pointer;flex-shrink:0;
  }
  .tg::after{
    content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
    background:#fff;transition:left .2s cubic-bezier(.5,1.6,.5,1);
  }
  .tg.on{background:var(--blue);box-shadow:0 0 12px var(--blue-glow)}
  .tg.on::after{left:20px}

  .sld{display:flex;align-items:center;gap:10px;width:200px}
  .sld input[type=range]{
    -webkit-appearance:none;flex:1;height:3px;border-radius:2px;
    background:rgba(255,255,255,.08);outline:none;cursor:pointer;
  }
  .sld input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:#fff;box-shadow:0 0 10px var(--blue-glow);cursor:pointer;
  }
  .sld .val{min-width:34px;text-align:right;font-size:11px;color:var(--blue-2);font-variant-numeric:tabular-nums}

  .cb{
    padding:5px 12px;border-radius:8px;
    background:rgba(30,109,255,.1);border:1px solid rgba(30,109,255,.3);
    font-size:11.5px;cursor:pointer;min-width:110px;text-align:center;
    transition:all .15s;color:var(--blue-2);
  }
  .cb:hover{background:rgba(30,109,255,.2);border-color:var(--blue)}

  .btn{
    padding:6px 14px;border-radius:8px;
    background:linear-gradient(135deg,var(--blue),var(--blue-2));
    border:none;font-size:11.5px;font-weight:600;cursor:pointer;
    transition:all .15s;color:#fff;
    box-shadow:0 4px 12px rgba(30,109,255,.3);
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(30,109,255,.5)}
  .btn.danger{background:linear-gradient(135deg,#e6334a,#ff5566);box-shadow:0 4px 12px rgba(230,51,74,.3)}
  .btn.danger:hover{box-shadow:0 6px 16px rgba(230,51,74,.5)}

  /* --- footer --- */
  .foot{
    position:absolute;bottom:0;left:0;right:0;height:32px;
    background:#000;border-top:1px solid var(--stroke);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;font-size:11px;color:var(--text-dim);letter-spacing:1px;
  }
  .foot .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue);margin-right:6px;box-shadow:0 0 8px var(--blue)}

  /* --- bouton fermer --- */
  .close{
    position:absolute;top:14px;right:14px;
    width:26px;height:26px;border-radius:6px;
    background:rgba(255,255,255,.04);border:1px solid var(--stroke);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--text-dim);font-size:14px;
    transition:all .15s;
  }
  .close:hover{background:rgba(230,51,74,.15);border-color:#e6334a;color:#fff}

  .sep-row{padding:14px 0 6px;border-top:1px solid var(--stroke);margin-top:6px}
  .sep-label{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:2px}
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="logo">RA<span>XO</span></div>
  <div class="bar"></div>
  <div class="pct">LOADING MODULES</div>
</div>

<div class="bind" id="bind">
  <h1>RA<span>XO</span></h1>
  <h2>Press a key to open</h2>
  <div class="box recording" id="bindBox">Waiting...</div>
  <div class="hint">F1 - F12 or any letter key</div>
</div>

<div class="wrap" id="wrap">
  <div class="close" onclick="post('close')">✕</div>
  <div class="cats" id="cats"></div>
  <div class="mid">
    <div class="mid-h" id="midTitle">Self</div>
    <div id="items"></div>
  </div>
  <div class="ctl-col" id="ctl"></div>
  <div class="foot">
    <div><span class="dot"></span><span id="footLeft">RAXO</span></div>
    <div id="footRight">1/10</div>
  </div>
</div>

<script>
const BANNER_URL = "https://i.pinimg.com/736x/3c/b5/fb/3cb5fb27977e675a3b162c065c998682.jpg";
// note : bannière retirée dans ce design (layout multi-colonnes). 
// Si tu la veux, dis-le et je l'intègre dans la colonne gauche en haut.

const SCHEMA = [
  { name:"Self", items:[
    { t:"cb",  k:"god",     n:"Godmode" },
    { t:"cb",  k:"stam",    n:"Infinite Stamina" },
    { t:"cb",  k:"norag",   n:"No Ragdoll" },
    { t:"cb",  k:"sjump",   n:"Super Jump" },
    { t:"cb",  k:"noclip",  n:"No Clip" },
    { t:"sl",  k:"ncspeed", n:"Noclip Speed", min:1, max:30, step:1, v:5 },
    { t:"sep", n:"Health" },
    { t:"btn", n:"Heal & Reset Armour", a:"heal" },
    { t:"btn", n:"Suicide", a:"suicide", d:true },
  ]},
  { name:"Online", items:[
    { t:"btn", n:"Kill Closest",    a:"kill" },
    { t:"btn", n:"Taze Closest",    a:"taze" },
    { t:"btn", n:"Force Fall",      a:"force_fall" },
    { t:"btn", n:"Explode Closest", a:"explode", d:true },
  ]},
  { name:"Visual", items:[
    { t:"cb", k:"esp_box",   n:"Player Box" },
    { t:"cb", k:"esp_name",  n:"Player Name" },
    { t:"cb", k:"esp_hp",    n:"Player HP" },
    { t:"cb", k:"esp_lines", n:"Player Lines" },
    { t:"cb", k:"esp_veh",   n:"Vehicle Name" },
    { t:"sl", k:"esp_dist",  n:"Max Distance", min:50, max:600, step:10, v:250 },
  ]},
  { name:"Combat", items:[
    { t:"cb",  k:"ab_on",   n:"Silent Aim" },
    { t:"cb",  k:"ab_lock", n:"Aim Lock" },
    { t:"sl",  k:"ab_fov",  n:"FOV", min:10, max:600, step:10, v:120 },
    { t:"sl",  k:"ab_smooth", n:"Smoothness", min:1, max:20, step:1, v:6 },
    { t:"cbo", k:"ab_bone", n:"Bone", o:["Head","Neck","Chest","Stomach"] },
    { t:"sep", n:"Punch" },
    { t:"cb",  k:"punch_super", n:"Super Punch" },
    { t:"sl",  k:"punch_power", n:"Punch Power x", min:100, max:5000, step:100, v:1000 },
  ]},
  { name:"Weapon", items:[
    { t:"cb",  k:"w_inf",    n:"Infinite Ammo" },
    { t:"cb",  k:"w_recoil", n:"No Recoil" },
    { t:"cb",  k:"w_spread", n:"No Spread" },
    { t:"btn", n:"Give All Weapons",   a:"w_give" },
    { t:"btn", n:"Remove All Weapons", a:"w_clear", d:true },
  ]},
  { name:"Vehicle", items:[
    { t:"cbo", k:"veh_model", n:"Model", o:["adder","zentorno","t20","sultan","kuruma","buffalo","police","riot"] },
    { t:"btn", n:"Spawn Vehicle", a:"veh_spawn" },
    { t:"cb",  k:"veh_god",  n:"Vehicle Godmode" },
    { t:"btn", n:"Repair Vehicle", a:"veh_repair" },
    { t:"btn", n:"Delete Vehicle", a:"veh_del", d:true },
    { t:"sep", n:"Carry" },
    { t:"cb",  k:"carry_veh",   n:"Carry Vehicle (E grab/drop)" },
    { t:"sl",  k:"carry_dist",  n:"Carry Distance", min:3, max:30, step:1, v:6 },
    { t:"cb",  k:"carry_physic",n:"Physics Throw (LMB)" },
    { t:"sl",  k:"carry_force", n:"Throw Force", min:50, max:2000, step:50, v:500 },
  ]},
  { name:"Miscellaneous", items:[
    { t:"btn", n:"Teleport to Waypoint", a:"tp_wp" },
    { t:"btn", n:"Teleport to Marker",   a:"tp_mk" },
  ]},
  { name:"Resources", items:[
    { t:"btn", n:"Stop monitor",          a:"stop_monitor" },
    { t:"btn", n:"Stop screenshot-basic", a:"stop_ss" },
  ]},
  { name:"Settings", items:[
    { t:"cb",  k:"ac_prefix", n:"Block ac_* events" },
    { t:"cb",  k:"ac_enc",    n:"Block encrypted events" },
    { t:"btn", n:"PANIC (unload)", a:"panic", d:true },
  ]},
];

const state = { cat:0, item:0, toggles:{}, sliders:{}, combos:{} };
for (const c of SCHEMA) for (const it of c.items) {
  if (it.t === "cb")  state.toggles[it.k] = false;
  if (it.t === "sl")  state.sliders[it.k] = it.v ?? it.min;
  if (it.t === "cbo") state.combos[it.k]  = 0;
}

const RES = (typeof GetParentResourceName === "function") ? GetParentResourceName() : "raxo";
function post(path, body={}) {
  return fetch(`https://${RES}/${path}`, {
    method:"POST",
    headers:{ "Content-Type":"application/json; charset=UTF-8" },
    body: JSON.stringify(body)
  }).catch(()=>{});
}

window.addEventListener("message", (e) => {
  const d = e.data || {};
  if (d.action === "open")  document.body.classList.add("open");
  if (d.action === "close") document.body.classList.remove("open");
  if (d.action === "hideLoading") document.getElementById("loading").classList.add("hide");
  if (d.action === "showBind") {
    document.getElementById("loading").classList.add("hide");
    document.getElementById("bind").classList.add("show");
  }
  if (d.action === "hideBind") document.getElementById("bind").classList.remove("show");
});

let recording = true;
document.addEventListener("keydown", (e) => {
  if (!recording) return;
  e.preventDefault();
  const label = e.key === " " ? "SPACE" : e.key.toUpperCase();
  document.getElementById("bindBox").textContent = label;
  document.getElementById("bindBox").classList.remove("recording");
  post("bindkey", { vk: e.keyCode });
  setTimeout(() => { recording = false; post("bindDone"); }, 800);
}, true);

const $cats = document.getElementById("cats");
const $items = document.getElementById("items");
const $midTitle = document.getElementById("midTitle");
const $ctl = document.getElementById("ctl");
const $footLeft = document.getElementById("footLeft");
const $footRight = document.getElementById("footRight");

function render(){
  // --- catégories ---
  $cats.innerHTML = "";
  SCHEMA.forEach((c, i) => {
    const el = document.createElement("div");
    el.className = "cat" + (i === state.cat ? " active" : "");
    el.innerHTML = `<span>${c.name}</span><span class="arrow">›</span>`;
    el.onclick = () => { state.cat = i; state.item = 0; render(); };
    $cats.appendChild(el);
  });

  // --- items ---
  const cat = SCHEMA[state.cat];
  $midTitle.textContent = cat.name;
  $items.innerHTML = "";
  cat.items.forEach((it, i) => {
    if (it.t === "sep") {
      const sep = document.createElement("div");
      sep.style.padding = "10px 18px 4px";
      sep.style.fontSize = "10px";
      sep.style.color = "var(--text-dim)";
      sep.style.textTransform = "uppercase";
      sep.style.letterSpacing = "2px";
      sep.textContent = it.n;
      $items.appendChild(sep);
      return;
    }
    const el = document.createElement("div");
    el.className = "item" + (i === state.item ? " active" : "");
    const isAction = (it.t === "btn");
    el.innerHTML = `<span class="name">${it.n}</span><span class="arrow">${isAction ? '›' : ''}</span>`;
    el.onclick = () => { state.item = i; render(); };
    $items.appendChild(el);
  });

  // --- contrôles ---
  $ctl.innerHTML = "";
  const ctlTitle = document.createElement("div");
  ctlTitle.className = "ctl-title";
  ctlTitle.textContent = cat.name + " — Controls";
  $ctl.appendChild(ctlTitle);

  cat.items.forEach((it, i) => {
    if (it.t === "sep") return;

    const row = document.createElement("div");
    row.className = "ctl-row" + (i === state.item ? " on" : "");

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = it.n;
    row.appendChild(label);

    if (it.t === "cb") {
      const tg = document.createElement("div");
      tg.className = "tg" + (state.toggles[it.k] ? " on" : "");
      tg.onclick = () => {
        state.toggles[it.k] = !state.toggles[it.k];
        post("state", { key: it.k, kind:"toggle", value: state.toggles[it.k] });
        render();
      };
      row.appendChild(tg);
    } else if (it.t === "sl") {
      const sld = document.createElement("div");
      sld.className = "sld";
      const inp = document.createElement("input");
      inp.type = "range"; inp.min = it.min; inp.max = it.max; inp.step = it.step;
      inp.value = state.sliders[it.k];
      const val = document.createElement("div");
      val.className = "val"; val.textContent = state.sliders[it.k];
      inp.oninput = () => { state.sliders[it.k] = +inp.value; val.textContent = inp.value; };
      inp.onchange = () => post("state", { key: it.k, kind:"slider", value:+inp.value });
      sld.appendChild(inp); sld.appendChild(val);
      row.appendChild(sld);
    } else if (it.t === "cbo") {
      const cb = document.createElement("div");
      cb.className = "cb";
      cb.textContent = it.o[state.combos[it.k]];
      cb.onclick = () => {
        state.combos[it.k] = (state.combos[it.k]+1) % it.o.length;
        cb.textContent = it.o[state.combos[it.k]];
        post("state", { key: it.k, kind:"combo", value: state.combos[it.k] });
      };
      row.appendChild(cb);
    } else if (it.t === "btn") {
      const btn = document.createElement("div");
      btn.className = "btn" + (it.d ? " danger" : "");
      btn.textContent = "Exécuter";
      btn.onclick = () => post("action", { a: it.a });
      row.appendChild(btn);
    }

    $ctl.appendChild(row);
  });

  // --- footer ---
  $footLeft.textContent = "RAXO // " + cat.name;
  $footRight.textContent = (state.item + 1) + "/" + cat.items.length;
}

// drag window
const wrap = document.getElementById("wrap");
let drag = null;
wrap.addEventListener("mousedown", e => {
  if (e.target.closest(".cat,.item,.tg,.cb,.btn,input,.close")) return;
  drag = { x:e.clientX, y:e.clientY, lx:wrap.offsetLeft, ly:wrap.offsetTop };
});
window.addEventListener("mousemove", e => {
  if (!drag) return;
  wrap.style.left = (drag.lx + e.clientX - drag.x) + "px";
  wrap.style.top  = (drag.ly + e.clientY - drag.y) + "px";
});
window.addEventListener("mouseup", () => drag = null);

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !recording) post("close");
});

render();
post("ready");
</script>
</body>
</html>
