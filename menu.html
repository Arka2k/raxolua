<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RAXO Banner</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;
    background:transparent;
    overflow:hidden;
    user-select:none;-webkit-user-drag:none;
  }
  .banner{
    position:fixed;
    top:0;left:0;
    width:100%;
    height:140px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    overflow:hidden;
    box-shadow:0 4px 24px rgba(0,0,0,.7);
  }
  .banner img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }
</style>
</head>
<body>
  <div class="banner">
    <img src="https://cdn.discordapp.com/attachments/1544140676772405340/1558700795833229323/Pogba.jpg?ex=6acc64bc&is=6acb133c&hm=0e8bf48b5078f83137fa1ff2b7e12faaa90fafc6ad286b6a9af6d369347285fe">
  </div>
</body>
</html>
