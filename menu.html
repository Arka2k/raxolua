<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial Black', Impact, sans-serif;
  }
  .banner {
    position: relative;
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, #050505 0%, #1a1a1a 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  .banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url('https://i.imgur.com/your-splatter-bg.png') center/cover;
    opacity: 0.4;
    mix-blend-mode: screen;
    pointer-events: none;
  }
  .title {
    position: relative;
    font-size: 6rem;
    font-weight: 900;
    letter-spacing: 0.1em;
    color: #e8e8e8;
    text-shadow: 0 0 20px rgba(255,255,255,0.6), 0 0 40px rgba(255,255,255,0.3);
    transform: rotate(-2deg);
    z-index: 2;
    -webkit-text-stroke: 2px #000;
    animation: pulse 2s infinite alternate;
  }
  @keyframes pulse {
    0% { text-shadow: 0 0 20px rgba(255,255,255,0.6), 0 0 40px rgba(255,255,255,0.3); }
    100% { text-shadow: 0 0 30px rgba(255,255,255,0.9), 0 0 60px rgba(255,255,255,0.5); }
  }
  .subtitle {
    position: absolute;
    bottom: 10%;
    font-size: 1rem;
    color: #666;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="banner">
    <div class="title">VANITY</div>
    <div class="subtitle">Build : BuLLeTxSkull</div>
  </div>
</body>
</html>
