<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RAXO Banner</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;
    background:transparent;
    overflow:hidden;
    user-select:none;-webkit-user-drag:none;
  }
  .banner{
    position:fixed;
    top:0;left:0;
    width:100%;
    height:130px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(160deg,#ff7a1a,#c94a00);
    overflow:hidden;
    box-shadow:0 4px 24px rgba(0,0,0,.6);
  }
  .banner img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }
  .banner .title{
    position:absolute;
    font-size:52px;font-weight:800;
    color:#0a0a0c;letter-spacing:8px;
    display:none;
    font-family:"Inter","Segoe UI",sans-serif;
  }
  .banner.noimg .title{display:block}
</style>
</head>
<body>
  <div class="banner" id="banner">
    <img id="img" src="" alt=""
         onload="document.getElementById('banner').classList.remove('noimg')"
         onerror="document.getElementById('banner').classList.add('noimg')">
    <div class="title">RAXO</div>
  </div>
<script>
  const URL = "https://i.pinimg.com/736x/3c/b5/fb/3cb5fb27977e675a3b162c065c998682.jpg";
  const img = document.getElementById("img");
  img.src = URL;
</script>
</body>
</html>
